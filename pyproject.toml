[project]
name = "cookiecutter-pypackage"
version = "0.2.0"
description = "Cookiecutter template for a Python package"
readme = "README.md"
python_requires = ">=3.6"
license = {file = "LICENSE"}
authors = [
    {name = "Sam Briggs", email = "briggySmalls90@gmail.com"}
]
maintainers = [
  {name = "Yukihiko Shinoda", email = "yuk.hik.future@gmail.com"}
]
keywords = ["cookiecutter", "template", "package"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development",
]
dependencies = ["cookiecutter"]

[project.urls]
homepage = "https://github.com/briggySmalls/cookiecutter-pypackage"
# documentation = "https://readthedocs.org"
repository = "https://github.com/briggySmalls/cookiecutter-pypackage"
# changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

[tool.isort]
# @see https://github.com/timothycrosley/isort/issues/694#issuecomment-581246882
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[[tool.mypy.overrides]]
module = [
    "cookiecutter.*",
    "invoke.*",
    "pytest_cookies.*",
    "setuptools.*",
]
ignore_missing_imports = true

[tool.pylint.basic]
# I tried values in order started from 2,
# I felt that docstring is unuseful until 6 while code keeps readable.
# 2020-05-25 Yukihiko Shinoda
docstring-min-length = "7"

[tool.pylint.messages_control]
disable = [
    # To support Python 3.5
    "consider-using-f-string",
]

[tool.pylint.options]
# Since this rule against single responsibility principle.
# @see https://stackoverflow.com/questions/28722314/why-does-pylint-want-2-public-methods-per-class/40258006#40258006
min-public-methods = "1"
